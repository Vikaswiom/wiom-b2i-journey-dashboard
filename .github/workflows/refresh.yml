name: Refresh and publish
# Refreshes the data and publishes the page to GitHub Pages.
# There is no schedule here. The one schedule for the whole dashboard is the Ship Tracker's refresh (every 3 hours):
# each of its runs pushes branch claude/refresh-trigger to this repo, and start-refresh.yml then starts this workflow.
# Nothing is committed: the built page and data go straight to Pages, so the repo does not grow with every refresh.
# A push to main (a page or query change) publishes the same way.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read      # the publish step looks up the uploaded site by this run's id
  pages: write
  id-token: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      # Just after midnight IST the source tables have not finished syncing yesterday. Until they have,
      # the data is not refreshed.
      # A push is a page or query change: publish it straight away with the data already on the site.
      # The data itself is refreshed by the 3-hourly run (workflow_dispatch from the Ship Tracker's schedule).
      - name: Is yesterday's data complete?
        id: fresh
        if: github.event_name != 'push'
        env: { METABASE_API_KEY: '${{ secrets.METABASE_API_KEY }}', TZ: Asia/Kolkata }
        run: |
          if python3 check_fresh.py; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "ok=false" >> $GITHUB_OUTPUT; echo "::notice::Source data not complete yet; keeping the data already on the site."; fi
      # The refresh normally takes 2 to 3 minutes, but about 20 when the database is busy (25 Nov 2026).
      # It is cut off at 28 minutes in case a query hangs. A push never waits for this step.
      - name: Refresh the data
        id: refresh
        if: steps.fresh.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 28
        env: { METABASE_API_KEY: '${{ secrets.METABASE_API_KEY }}', TZ: Asia/Kolkata }
        run: python3 refresh_all.py
      # A page change must still go live when the data could not be refreshed: reuse the data files that are
      # on the live site now. The run is marked with a warning, and the next run refreshes the data.
      - name: Keep the data already on the site (refresh skipped, slow or failed)
        if: steps.refresh.outcome != 'success'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "Page change: publishing with the data already on the site."; else echo "::warning::Data not refreshed in this run; publishing with the data already on the site."; fi
          for f in b2i_snapshot b2i_deep_snapshot b2i_yesterday_snapshot b2i_csp_snapshot; do
            curl -fsS --retry 3 -o "$f.json" "https://vikaswiom.github.io/wiom-b2i-journey-dashboard/data/$f.json?t=$(date +%s)"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f.json"
          done
      - name: Build the site
        env: { TZ: Asia/Kolkata }
        run: |
          python3 build_site.py
          mkdir -p docs/data
          cp b2i_snapshot.json b2i_deep_snapshot.json b2i_yesterday_snapshot.json b2i_csp_snapshot.json docs/data/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: docs }

  # Publishing is its own job, with a second try: asked for straight after the upload, GitHub sometimes
  # answers that the uploaded site does not exist yet ("Found 0 artifacts").
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before the second try
        if: steps.first.outcome == 'failure'
        run: sleep 45
      - name: Publish to GitHub Pages (second try)
        id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5

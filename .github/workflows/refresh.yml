name: Refresh and publish
# Refreshes the data and publishes the page to GitHub Pages every 30 minutes.
# Nothing is committed: the built page and data go straight to Pages, so the repo does not grow with every refresh.
# A push to main (a page or query change) publishes the same way.
on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes (GitHub may start scheduled runs late)
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      # Just after midnight IST the source tables have not finished syncing yesterday. Until they have,
      # keep the page as it is and let the next run try again.
      - name: Is yesterday's data complete?
        id: fresh
        env: { METABASE_API_KEY: '${{ secrets.METABASE_API_KEY }}', TZ: Asia/Kolkata }
        run: |
          if python3 check_fresh.py; then echo "ok=true" >> $GITHUB_OUTPUT; else echo "ok=false" >> $GITHUB_OUTPUT; echo "::notice::Source data not complete yet; page left as it is."; fi
      - name: Refresh (up to 2 attempts)
        if: steps.fresh.outputs.ok == 'true'
        env: { METABASE_API_KEY: '${{ secrets.METABASE_API_KEY }}', TZ: Asia/Kolkata }
        run: |
          for i in 1 2; do
            echo "::group::Attempt $i"
            if python3 refresh_all.py; then echo "::endgroup::"; echo "Attempt $i succeeded"; exit 0; fi
            echo "::endgroup::"; echo "Attempt $i failed"
            [ $i -lt 2 ] && sleep 60
          done
          echo "Both attempts failed; the next run will try again."; exit 1
      - name: Build the site
        if: steps.fresh.outputs.ok == 'true'
        env: { TZ: Asia/Kolkata }
        run: |
          python3 build_site.py
          mkdir -p docs/data
          cp b2i_snapshot.json b2i_deep_snapshot.json b2i_yesterday_snapshot.json b2i_csp_snapshot.json docs/data/
      - uses: actions/configure-pages@v6
        if: steps.fresh.outputs.ok == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.fresh.outputs.ok == 'true'
        with: { path: docs }
      - name: Publish to GitHub Pages
        id: deploy
        if: steps.fresh.outputs.ok == 'true'
        uses: actions/deploy-pages@v5

name: Daily refresh
on:
  schedule:
    - cron: '41 3 * * *'   # 09:11 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
env:
  TZ: Asia/Kolkata
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Check Metabase is reachable
        run: curl -sS -o /dev/null -w "metabase http %{http_code}\n" --max-time 30 https://metabase.wiom.in/api/health
      - name: Run all queries and shape data
        env: { METABASE_API_KEY: '${{ secrets.METABASE_API_KEY }}', TZ: 'Asia/Kolkata' }
        run: python3 refresh_all.py
      - name: Publish data files
        run: |
          python3 build_site.py
          mkdir -p docs/data
          cp b2i_snapshot.json b2i_deep_snapshot.json b2i_yesterday_snapshot.json b2i_csp_snapshot.json docs/data/
          git config user.name "b2i-refresh-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/data/*.json
          git diff --cached --quiet && echo "no change" || (git commit -m "Daily data refresh $(date +'%Y-%m-%d %H:%M IST')" && git push)
